<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@600;700;800;900&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<!--
		"tap" (pointerdown), not "hover". On hover SvelteKit preloaded each
		route's JS and CSS on every pointer pass, and the deck is dense with
		links the presenter sweeps over without clicking — so most preloads went
		unused and Chrome logged one warning per wasted <link rel=preload>.
		pointerdown still beats the click by ~100ms, which is the whole benefit.
	-->
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
